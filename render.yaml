services:
  # 1. Python FastAPI Backend (Machine Learning)
  - type: web
    name: churn-python-api
    env: python
    region: singapore
    repo: https://github.com/your-username/your-repo # GANTI DENGAN URL REPO GITHUB KAMU
    branch: main
    rootDir: backend-python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free

  # 2. Node.js API Gateway
  - type: web
    name: churn-node-api
    env: node
    region: singapore
    repo: https://github.com/your-username/your-repo # GANTI DENGAN URL REPO GITHUB KAMU
    branch: main
    rootDir: backend-node
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: FASTAPI_URL
        value: https://churn-python-api.onrender.com
      - key: FRONTEND_URL
        value: https://churn-predictor.vercel.app # Ganti dengan URL Vercel kamu nanti
